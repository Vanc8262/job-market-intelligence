environment: development
project:
  name: job-market-intelligence
  version: 0.1.0
paths:
  data_dir: data
  bronze_dir: data/bronze
  silver_dir: data/silver
  gold_dir: data/gold
  cache_dir: data/cache
  checkpoint_dir: data/checkpoints
  log_dir: logs
  # Resumes, extracted text, and candidate metadata. Never committed.
  private_dir: data/private
storage:
  default: json
  compression: zstd
  partition_by:
    - source
    - ingestion_date
logging:
  level: INFO
scraping:
  max_retries: 5
  retry_delay_seconds: 2.0
  checkpoint_interval: 100
  request_timeout_seconds: 30
  user_agent: JMIPBot/0.1
processing:
  batch_size: 1000
  strict_validation: true
candidate_profile:
  default_profile_id: profile-default
resume_ingestion:
  max_file_size_bytes: 10485760
  max_pdf_pages: 20
  max_docx_entries: 500
  max_docx_uncompressed_bytes: 26214400
  max_docx_compression_ratio: 100
  max_extracted_characters: 100000
  minimum_characters: 200
  minimum_words: 40
  minimum_alphanumeric_ratio: 0.45
  maximum_replacement_ratio: 0.01
  minimum_quality_score: 0.75
