# Aliases are matched as exact source spans and normalized to the canonical key.
# Keep this list conservative: aliases must be explicit technical terminology.
aliases:
  Python:
    - Python 3
    - Python3
  SQL:
    - Structured Query Language
  JavaScript:
    - JS
  Go:
    - Golang
  scikit-learn:
    - scikit learn
    - sklearn
