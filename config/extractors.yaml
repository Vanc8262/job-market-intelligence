# Targets run in declaration order. Resume-aligned recommendations are listed
# first, followed by the previously selected company career sites.
targets:

  - name: palantir-lever
    source: lever
    enabled: true
    company_name: Palantir
    site: palantir

  - name: modmed-workday
    source: workday
    enabled: true
    company_name: ModMed
    host: https://modmed.wd501.myworkdayjobs.com
    tenant: modmed
    site: ModMed12
    page_size: 20

  - name: nextera-energy
    source: nextera
    enabled: true
    company_name: NextEra Energy
    host: https://jobs.nexteraenergy.com
    site: nextera-energy

  - name: chewy-phenom
    source: phenom
    enabled: true
    company_name: Chewy
    host: https://careers.chewy.com
    tenant: CHINUS
    site: chewy
    locale: en_us
    path_prefix: /us/en

  - name: cloudflare-greenhouse
    source: greenhouse
    enabled: true
    company_name: Cloudflare
    board_token: cloudflare

  - name: datadog-greenhouse
    source: greenhouse
    enabled: true
    company_name: Datadog
    board_token: datadog

  - name: ramp-ashby
    source: ashby
    enabled: true
    company_name: Ramp
    job_board_name: ramp
    include_unlisted: false

  - name: workday-careers
    source: workday
    enabled: true
    company_name: Workday
    host: https://workday.wd5.myworkdayjobs.com
    tenant: workday
    site: Workday
    page_size: 20

  - name: chime-greenhouse
    source: greenhouse
    enabled: true
    company_name: Chime
    board_token: chime

  - name: spotify-lever
    source: lever
    enabled: true
    company_name: Spotify
    site: spotify

  - name: owner-ashby
    source: ashby
    enabled: true
    company_name: Owner
    job_board_name: owner
    include_unlisted: false

  # Added 2026-10-31 from employers on the owner's applications worksheet. Each board was
  # checked first: Greenhouse's public Job Board API, and Workday robots.txt files that
  # allow the career site (same template as ModMed, only /refreshFacet/ disallowed).
  - name: voloridge-greenhouse
    source: greenhouse
    enabled: true
    company_name: Voloridge Investment Management
    board_token: voloridgeinvestmentmanagement

  - name: wurl-greenhouse
    source: greenhouse
    enabled: true
    company_name: Wurl
    board_token: wurljobs

  - name: guidepoint-greenhouse
    source: greenhouse
    enabled: true
    company_name: GuidePoint Security
    board_token: guidepointsecurity

  - name: fti-consulting-workday
    source: workday
    enabled: true
    company_name: FTI Consulting
    host: https://fticonsulting.wd108.myworkdayjobs.com
    tenant: fticonsulting
    site: FTIConsultingCareers
    page_size: 20

  - name: workiva-workday
    source: workday
    enabled: true
    company_name: Workiva
    host: https://workiva.wd503.myworkdayjobs.com
    tenant: workiva
    site: careers
    page_size: 20

  - name: chemours-workday
    source: workday
    enabled: true
    company_name: Chemours
    host: https://chemours.wd103.myworkdayjobs.com
    tenant: chemours
    site: Chemours
    page_size: 20

  - name: athena-workday
    source: workday
    enabled: true
    company_name: Athena
    host: https://athenago.wd108.myworkdayjobs.com
    tenant: athenago
    site: athena
    page_size: 20
