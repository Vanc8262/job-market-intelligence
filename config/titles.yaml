# Titles that match no canonical title are classified by keyword: the first rule with a
# keyword in the title wins, and anything left falls back to `other`. Source department
# names (for example Lever's "Dev" or Greenhouse's "Leadership") are never used as
# families, so every posting lands in one of the governed families above.
fallback_family: other
family_rules:
  # Physical-world and customer-facing engineering is not software engineering.
  - family: other
    keywords:
      [field engineer, field service, power generation, turbine, combustion, nuclear, solar,
       wind technician, battery, substation, transmission, electrical engineer,
       mechanical engineer, civil engineer, controls engineer, control systems,
       controls systems, safety engineer, maintenance, construction, pipeline engineering,
       technician, machinist, sales engineer, solutions engineer, solutions architect,
       solutions consultant, customer engineer, veterinarian, pharmacy]
  - family: product_management
    keywords:
      [product manager, product management, product owner, program manager,
       project manager, technical program, PM]
  - family: machine_learning
    keywords:
      [machine learning, ML, AI engineer, AI research, AI/ML, artificial intelligence,
       deep learning, LLM, MLOps, computer vision, NLP, agentic, generative AI]
  - family: data_engineering
    keywords:
      [data engineer, data engineering, data platform, data infrastructure, ETL,
       data pipeline, analytics engineer]
  - family: software_engineering
    keywords:
      [software, engineer, engineering, developer, programmer, SRE, site reliability,
       devops, dev ops, backend, back end, frontend, front end, full stack, fullstack,
       architect, tech lead, CTO]
  - family: data_science
    keywords:
      [data science, data scientist, analytics, analyst, applied science, decision science,
       insights, quantitative, statistician, business intelligence, research scientist]

seniority_keywords:
  entry: [junior, jr, associate, new grad, new graduate, intern]
  mid: [engineer, developer, analyst, scientist]
  senior: [senior, sr, lead]
  staff: [staff, principal, distinguished]
  manager: [manager]
  director: [director, head of]
  executive: [vice president, vp, chief]
