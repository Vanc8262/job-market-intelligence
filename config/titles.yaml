taxonomy_id: jmip-title-taxonomy
version: 1.0.0

families:
  data_science:
    label: Data Science and Analytics
    description: Roles whose primary output is analysis, experimentation, inference, or decision support.
  machine_learning:
    label: Machine Learning and AI
    description: Roles whose primary output is a production ML or AI model, system, or research capability.
  data_engineering:
    label: Data Engineering
    description: Roles whose primary output is reliable data movement, transformation, storage, or serving infrastructure.
  software_engineering:
    label: Software Engineering
    description: Roles whose primary output is production software, services, platforms, or software reliability.
  product_management:
    label: Product and Program Management
    description: Roles that own product, program, or project outcomes rather than build them.
  other:
    label: Other Roles
    description: Everything else, including non-software engineering, operations, sales, and support.

# Canonical titles identify occupations, not seniority. Keep employer, team, domain,
# technology, employment type, and level modifiers in the observed source title.
canonical_titles:
  - id: data-scientist
    title: Data Scientist
    family: data_science
    track: individual_contributor
    aliases: [Decision Scientist, Product Data Scientist]
    related_title_ids: [applied-scientist, machine-learning-engineer, data-analyst]
  - id: data-analyst
    title: Data Analyst
    family: data_science
    track: individual_contributor
    aliases: [Analytics Analyst]
    related_title_ids: [business-intelligence-analyst, data-scientist, analytics-engineer]
  - id: business-intelligence-analyst
