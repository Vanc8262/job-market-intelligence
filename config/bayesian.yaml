# Phase 8 Bayesian models. Every model is versioned here and stays advisory: it reports
# beside the rule it extends, and changing a weight or threshold remains a human edit.
#
# mode: advisory  - Bayesian verdicts are reported but never change pass/fail.
#       enforce   - the data-quality gate uses the Bayesian verdicts for coverage checks
#                   (a check fails only when it is probably below its threshold).
mode: advisory
# Width of every reported credible interval.
credible_level: 0.9

# B0: convergence gate for sampled (MCMC) models, from B2 onward.
diagnostics:
  max_rhat: 1.01
  min_ess_bulk: 400
  min_ess_tail: 400
  max_divergences: 0

# B1: Beta-Binomial evaluation of the data_quality.yaml coverage thresholds.
quality_gate:
  enabled: true
  version: 1.0.0
  # Jeffreys prior, Beta(0.5, 0.5): weakly informative for a rate.
  prior_alpha: 0.5
  prior_beta: 0.5
  # Pass when P(rate meets threshold) >= 0.9, fail when <= 0.1, otherwise uncertain.
  pass_probability: 0.9
  fail_probability: 0.1
  # Employers with fewer postings than this are still pooled but not listed.
  minimum_employer_postings: 3

# B1: empirical-Bayes shrinkage of skill shares within role families.
skill_shares:
  enabled: true
  version: 1.0.0
  top_skills: 40
  minimum_family_postings: 5
  # Prior pseudo-counts when too few families exist to fit one.
  fallback_prior_strength: 10
  max_prior_strength: 1000

# B3: relevance weights learned from your tracking decisions (Bayesian logistic regression,
# design in docs/design/phase-8-b3-relevance-weights.md). Advisory: it suggests weights with
# intervals; changing `weights:` in resume_profile.local.yaml stays your edit.
#   logit P(keep) = alpha + tau * (score(w) - mean score), w ~ Dirichlet(prior_strength * current)
relevance_weights:
  enabled: true
  version: 1.0.0
  # Dirichlet pseudo-counts around the current weights (about "this many labels' worth").
  prior_strength: 40
  # LogNormal prior on tau: median 4 means a 25-point score gap multiplies the odds by ~2.7.
  tau_prior: {median: 4.0, sigma: 0.75}
  intercept_sigma: 1.5
  # weights_plus_fit only: coefficient on the 6.3 fit score (0-1 scale, centered).
  fit_coefficient_sigma: 1.5
  # Compared with PSIS-LOO: base rate, the current score, learned weights, weights + 6.3 fit.
  models: [baseline, current_score, learned_weights, weights_plus_fit]
  # Rows added later by sync carry the signals of the day they were added.
  include_sync_rows: true
  # Extra learned-weights fits shown beside the main one.
  sensitivity: {without_sync: true, prior_strengths: [20, 80]}
  sampler: {name: nutpie, chains: 4, tune: 1000, draws: 1000, target_accept: 0.95, seed: 20261102}
  # Suggest raising or lowering a weight only when P(direction) >= direction_probability and
  # learned weights beat the current score by more than elpd_se_multiple standard errors.
  recommend: {direction_probability: 0.9, elpd_se_multiple: 2.0, target_interval_points: 10}
  calibration_bins: 4
  # Rows whose Pareto k exceeds pareto_k_threshold are refit exactly, up to this many per model.
  max_exact_refits: 10
  pareto_k_threshold: 0.7
