# Phase 6.3: application comparison. Each current posting is compared with the approved,
# active resume on four dimensions, each with evidence:
#   requirements - share of the posting's requirement lines the resume meets
#   keywords     - ATS-style overlap of taxonomy skills, rarer skills weighted higher
#   seniority    - posting level and minimum years against the resume's experience
#   domain       - industries the posting works in that the resume also shows
# The fit score is a transparent weighted average; Phase 8 stage B3 will later turn these
# signals into a calibrated probability using your application outcomes.
version: 1.5.5
weights:
  requirements: 0.45
  keywords: 0.30
  seniority: 0.15
  domain: 0.10
# Preferred ("nice to have") lines count half as much as required ones.
preferred_weight: 0.5
# Lines with no skill, years, or degree are judged by word overlap with the resume and
# count half as much; at least this share of their key terms must appear in the resume.
text_requirement_weight: 0.5
text_match_threshold: 0.6
max_requirements: 40
# "Foundry, Contour, or comparable platforms": having a named product meets the line;
# having only something comparable earns this share of it (shown as partial).
comparable_credit: 0.6
# Skill and concept lines that also ask for years ("5+ years of Python", "10+ years of
# software development"): short of the years is half credit (partial), but a resume with
# less than this share of them, or none in the job the line names ("5+ years as a
# front-end engineer", see `years_subject`), does not meet the line (missing).
# Leadership lines follow `leadership` below.
line_years:
  missing_below_share: 0.34
# Lines that ask for years of leadership ("5+ years in a leadership role", "3+ years
# managing engineering teams", matched by `line_patterns`) count only resume roles whose
# title or highlights show leading people (`evidence_patterns`); lines asking to manage
# managers count only roles with a manager title (`manager_title_patterns`). Those years
# meet the line, fall within a year of it (partial), or are missing. Leadership lines
# without years follow `skill_line_patterns` below.
leadership:
  enabled: true
  line_patterns:
    - '\bleadership\s+(role|position|experience)s?\b'
    - '\b(people|engineering|team)\s+manage(r|ment)\b'
    - '\b(manag|lead)(e|es|ed|ing)\b[^.;]{0,40}?\b(teams?|engineers|people|reports|managers|staff)\b'
  evidence_patterns:
    - '\b(led|lead|leading|managed|manager|supervised|supervisor|mentored|director|head of)\b'
  manager_line_patterns:
    - '\bmanag(e|es|ed|ing)\s+(other\s+)?managers\b'
    - '\bmanagers?\s+of\s+managers\b'
  manager_title_patterns:
    - '\b(manager|director|head|vp|vice president)\b'
  # Leadership lines that do not ask for years ("Proven leadership skills to guide teams",
  # "Ability to lead and motivate a team", "technical leadership experience") are met
  # when any role shows leading people (`evidence_patterns`, quoted as evidence) and
  # missing otherwise. The owner judges these met on his resume.
  skill_line_patterns:
    - '\bleadership\b'
    - '\b(lead|leading|guide|guiding|motivate|motivating|mentor|mentoring|manage|managing)\b[^.;]{0,40}?\b(teams?|others|people|engineers|developers|staff|reports)\b'
# Years lines that name a job ("4+ years as a Product Manager", "2+ years in a fraud
# analyst role", matched by `role_patterns`) count only resume roles whose title or
# highlights share at least `min_shared_terms` of the line's subject terms (all of them
# when it names fewer). Other years lines ("2+ years deploying software to edge systems",
# "experience in a similar role") compare with total years. Words in `generic_terms` are
# never subject terms.
years_subject:
  enabled: true
  role_patterns:
    - '\bas an?\s+(?!(plus|bonus|minimum|whole|result|team|part|member|way)\b)[a-z]'
    - '\b(?!(similar|related|relevant|comparable|equivalent|this|that|the|same|an?|any|such)\b)[a-z][a-z-]+\s+(role|position)s?\b'
  min_shared_terms: 2
  generic_terms: [relevant, professional, industry, work, working, post-college, college, progressive, progressively, combined, total, hands-on, full-time, related, similar, role, roles, field, fields, including, minimum, least, prior, previous, experience, experiences, experienced, years, year, demonstrated, proven, direct, required, preferred, strongly, practical, applicable, equivalent, environment, environments, setting, settings, fast-paced, organization, organizations, company, companies, team, teams, comparable, recent, overall, plus, ideally, preferably, highly, desired, demonstrable, successful, track, record, history, meaningful, time, spent, focus, focused, especially, qualification, qualifications, degree, degrees, bachelor, bachelors, "bachelor’s", "bachelor's", lieu, i.e, e.g, etc]
# Degree lines whose level the resume meets but whose field it does not show. A specific
# named field ("Bachelor's in Chemistry" against a data science degree) earns
# `unrelated_credit`; a broad one in `broad_fields` ("a degree in engineering"), or a
# field this vocabulary does not know, earns `broad_credit`. Electrical engineering is
# listed as broad because the owner judges it close enough to count as partial.
degree_fields:
  unrelated_credit: 0.0
  broad_fields: [engineering, business, electrical engineering]
  broad_credit: 0.5
# Requirements and keyword scores start from a neutral 50% worth this many requirement
# lines (or rarity-weighted keywords), so a posting with one or two assessable lines
# cannot score 0% or 100% on its own.
evidence_prior_weight: 2.0
strong_threshold: 75
moderate_threshold: 55
seniority_scores:
  entry: 1.0
  mid: 1.0
  unknown: 0.8
  senior: 0.4
  staff: 0.1
  manager: 0.1
  director: 0.05
  executive: 0.05
# A posting is in a domain when at least `domain_minimum_hits` different terms appear
# outside its benefits and legal sections; the resume needs one.
domain_minimum_hits: 2
