  computing_and_data: [computer science, data science, software engineering, computer engineering, information technology, information systems, computer information systems, data analytics, analytics, informatics, computer programming, programming, computing]
  mathematics_and_statistics: [mathematics, applied mathematics, math, statistics, applied statistics, data science, operations research, actuarial science, quantitative finance]
