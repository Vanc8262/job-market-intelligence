  finance: [fintech, financial, banking, payments, credit, lending, fraud, trading, accounting, insurance, transactions]
  retail_ecommerce: [e-commerce, ecommerce, retail, retailer, merchandising, marketplace, shoppers, storefront, consumer products]
  supply_chain: [supply chain, logistics, fulfillment, warehouse, inventory, shipping, procurement, distribution center]
  energy: [energy, utility, utilities, power generation, renewable, solar, wind, grid, electricity, nuclear]
  cloud_infrastructure: [cloud, infrastructure, observability, DevOps, distributed systems, Kubernetes, CI/CD, microservices, SaaS]
  security: [cybersecurity, security engineering, threat detection, vulnerability, zero trust, identity and access, IAM, SOC 2]
  data_analytics: [analytics, data platform, data warehouse, business intelligence, dashboards, reporting, ETL]
  ai_ml: [machine learning, artificial intelligence, AI, LLM, LLMs, deep learning, computer vision, neural networks, generative AI]
