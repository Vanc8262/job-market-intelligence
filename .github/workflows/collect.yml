name: collect

# Daily job-posting collection. Pipeline data (Bronze, Silver, Gold, checkpoints) lives in
# the private Vanc8262/jmip-data repository; nothing personal is used or written here.
# Gold relevance scores in that repository use the template profile; rebuild Gold on your
# own computer (scripts/build_gold.py) to rank postings against your approved resume.
on:
  schedule:
    - cron: "17 10 * * *" # 10:17 UTC daily (6:17 AM Eastern in summer, 5:17 AM in winter)
  workflow_dispatch:
    inputs:
      count_for_cadence:
        description: "Count this manual run in the daily/weekly/biweekly comparison"
        type: boolean
        default: false
      limit_per_target:
        description: "Override postings per employer (blank = configured limit)"
        type: string
        default: ""

permissions:
  contents: read

concurrency:
  group: collect
  cancel-in-progress: false

jobs:
  collect:
    # Never run in forks; they have neither the data repository nor its key.
    if: github.repository == 'Vanc8262/job-market-intelligence'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      JMIP_PIPELINE_DATA_DIR: ${{ github.workspace }}/jmip-data
    steps:
      - uses: actions/checkout@v4

      - name: Check out the data repository
        uses: actions/checkout@v4
        with:
          repository: Vanc8262/jmip-data
          ref: main
          ssh-key: ${{ secrets.JMIP_DATA_DEPLOY_KEY }}
          path: jmip-data

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Collect, process, and score
        id: collect
        env:
          LIMIT: ${{ inputs.limit_per_target }}
        run: |
          started=$(date +%s)
          args=()
          if [ -n "$LIMIT" ]; then args+=(--limit-per-target "$LIMIT"); fi
          set +e
          python scripts/collect_candidates.py "${args[@]}" > "$RUNNER_TEMP/collect.json"
          code=$?
          set -e
          echo "exit_code=$code" >> "$GITHUB_OUTPUT"
          echo "seconds=$(( $(date +%s) - started ))" >> "$GITHUB_OUTPUT"
          echo "Collection finished with exit code $code"

      - name: Log the run and compare cadences
        env:
          SCHEDULED: ${{ github.event_name == 'schedule' || inputs.count_for_cadence }}
        run: |
          flags=(--record --run-seconds "${{ steps.collect.outputs.seconds }}" --summary-file "$GITHUB_STEP_SUMMARY")
          if [ "$SCHEDULED" = "true" ]; then flags+=(--scheduled); fi
          python scripts/cadence_report.py "${flags[@]}"
          {
            echo ""
            echo "Collection exit code: ${{ steps.collect.outputs.exit_code }} (nonzero means a source or quality check failed; data was still saved)."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Save data to the data repository
        working-directory: jmip-data
        run: |
          git config user.name "jmip-collector"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          cp gold/cadence/latest.md CADENCE.md 2>/dev/null || true
          git add -A
          if git diff --cached --quiet; then
            echo "No data changes."
            exit 0
          fi
          git commit -q -m "Collection $(date -u +%Y-%m-%dT%H:%MZ) (${{ github.event_name }})"
          git push -q origin HEAD:main

      - name: Fail if collection reported problems
        if: steps.collect.outputs.exit_code != '0'
        run: |
          echo "::error::collect_candidates.py exited with ${{ steps.collect.outputs.exit_code }}; see the data repository's gold/data_quality/latest.json"
          exit 1
