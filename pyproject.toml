[build-system]
requires = ["setuptools>=70", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "job-market-intelligence"
version = "0.1.0"
description = "Foundation for a source-agnostic job market intelligence platform."
readme = "README.md"
requires-python = ">=3.12"
authors = [{ name = "JMIP Maintainers" }]
dependencies = [
  "pydantic>=2.8",
  "PyYAML>=6.0",
  "loguru>=0.7",
  "duckdb>=1.0",
  "pandas>=2.2",
  "polars>=1.0",
  "pyarrow>=16.0",
  "httpx>=0.27",
  "playwright>=1.45",
  "beautifulsoup4>=4.12",
  "lxml>=5.2",
  "python-dotenv>=1.0",
]

[tool.setuptools]
py-modules = []

[tool.black]
line-length = 100
target-version = ["py312"]

[tool.isort]
profile = "black"
line_length = 100
known_first_party = ["analytics", "dashboard", "enrichment", "extractors", "models", "processors", "storage", "utils"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "ANN", "D"]
ignore = ["D203", "D213"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["D", "ANN"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-ra"

[tool.mypy]
python_version = "3.12"
strict = true
warn_unused_configs = true
ignore_missing_imports = true
