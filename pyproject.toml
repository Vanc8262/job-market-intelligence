[build-system]
requires = ["setuptools>=70", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "job-market-intelligence"
version = "0.1.0"
description = "Local, configuration-driven job market intelligence pipeline and dashboard."
readme = "README.md"
requires-python = ">=3.12"
authors = [{ name = "JMIP Maintainers" }]
dependencies = [
  "pydantic>=2.8",
  "PyYAML>=6.0",
  "loguru>=0.7",
  "httpx>=0.27",
  "beautifulsoup4>=4.12",
  "lxml>=5.2",
  "python-dotenv>=1.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.2",
  "ruff>=0.5",
  "mypy>=1.10",
  "types-PyYAML>=6.0",
]
docs = [
  "python-docx>=1.1",
]

[tool.setuptools]
py-modules = []

[tool.black]
line-length = 100
target-version = ["py312"]

[tool.isort]
profile = "black"
line_length = 100
known_first_party = [
  "analytics",
  "dashboard",
  "enrichment",
  "extractors",
  "models",
  "pipeline",
  "processors",
  "storage",
  "utils",
]

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = [
  ".pytest-state",
  "data",
  "tmp",
]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "ANN", "D"]
ignore = ["D203", "D213"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["D", "ANN"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-ra --strict-config --strict-markers"
cache_dir = ".pytest-state/cache"
tmp_path_retention_policy = "failed"
tmp_path_retention_count = 1

[tool.mypy]
python_version = "3.12"
strict = true
warn_unused_configs = true
ignore_missing_imports = true
